name: OTA Builder VP - RLE

# RLE 已是 VitePress+项目主题：跳过 wash_hugo，直通上游 docs/。
# 错峰 02:20。
on:
  schedule:
    - cron: '20 18 * * *'
  workflow_dispatch:

jobs:
  build-rle-vp:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: ./New-Trans-Prism-Builder
    steps:
    - name: Checkout Builder Repo
      uses: actions/checkout@v4

    - name: Check Upstream Hash
      id: check
      run: |
        LATEST_HASH=$(git -c credential.helper= ls-remote https://github.com/project-trans/RLE-wiki.git HEAD | awk '{print $1}')
        LOCAL_HASH=""; [ -f "profiles/rle.last_hash" ] && LOCAL_HASH=$(cat profiles/rle.last_hash)
        if [ "$LATEST_HASH" == "$LOCAL_HASH" ]; then
          echo "HAS_CHANGES=false" >> $GITHUB_OUTPUT
        else
          echo "HAS_CHANGES=true" >> $GITHUB_OUTPUT
          echo "LATEST_HASH=$LATEST_HASH" >> $GITHUB_ENV
        fi

    - name: Clone Upstream Wiki
      if: steps.check.outputs.HAS_CHANGES == 'true' || github.event_name == 'workflow_dispatch'
      run: |
        git clone --depth 1 https://github.com/project-trans/RLE-wiki.git official-source

    - name: Setup Python + Node
      if: steps.check.outputs.HAS_CHANGES == 'true' || github.event_name == 'workflow_dispatch'
      uses: actions/setup-python@v5
      with: { python-version: '3.10' }
    - uses: pnpm/action-setup@v4
      if: steps.check.outputs.HAS_CHANGES == 'true' || github.event_name == 'workflow_dispatch'
      with: { version: 10 }
    - uses: actions/setup-node@v4
      if: steps.check.outputs.HAS_CHANGES == 'true' || github.event_name == 'workflow_dispatch'
      with: { node-version: 20 }

    - name: Wash + Slim + Scaffold
      if: steps.check.outputs.HAS_CHANGES == 'true' || github.event_name == 'workflow_dispatch'
      run: |
        python -m pip install --upgrade pip Pillow pyyaml -q
        python tools/build_vp.py --profile profiles/rle.yaml --upstream official-source --workdir work-rle
        python tools/wash_vitepress.py --docs work-rle/docs
        python tools/slim_images.py --docs work-rle/docs
        python tools/slim_pdfs.py --docs work-rle/docs --pdf-base https://rle.wiki/

    - name: Build VitePress
      if: steps.check.outputs.HAS_CHANGES == 'true' || github.event_name == 'workflow_dispatch'
      working-directory: ./New-Trans-Prism-Builder/work-rle
      run: |
        pnpm install --no-frozen-lockfile
        pnpm build

    - name: Pack + Release
      if: steps.check.outputs.HAS_CHANGES == 'true' || github.event_name == 'workflow_dispatch'
      run: |
        RELEASE_DATE=$(date -d "+8 hours" +%Y-%m-%d)
        python tools/pack.py --profile profiles/rle.yaml --workdir work-rle --date $RELEASE_DATE
        python tools/audit_links.py work-rle/docs/.vitepress/dist
        echo "TAG_NAME=rle-$RELEASE_DATE" >> $GITHUB_ENV
        rm -rf official-source work-rle
    - uses: softprops/action-gh-release@v2
      if: steps.check.outputs.HAS_CHANGES == 'true' || github.event_name == 'workflow_dispatch'
      with:
        files: New-Trans-Prism-Builder/rle-wiki-site-*.zip
        tag_name: ${{ env.TAG_NAME }}
        name: "RLE VP 自动构建版 ${{ env.TAG_NAME }}"
        body: "🤖 上游同步 Hash: `${{ env.LATEST_HASH }}`"

    - name: Commit Sync Log
      if: steps.check.outputs.HAS_CHANGES == 'true'
      working-directory: .
      run: |
        echo ${{ env.LATEST_HASH }} > New-Trans-Prism-Builder/profiles/rle.last_hash
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}
        git fetch origin ${{ github.ref_name }} && git reset --soft FETCH_HEAD
        git add New-Trans-Prism-Builder/profiles/rle.last_hash
        git commit -m "📝 chore(rle): 自动更新指纹日志" || echo "无新日志需要提交"
        git push origin HEAD:${{ github.ref_name }}
