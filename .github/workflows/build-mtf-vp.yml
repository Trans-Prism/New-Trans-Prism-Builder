name: OTA Builder VP - MtF

on:
  schedule:
    # ⏱️ Hugo 系错峰：MtF 02:00（北京）
    - cron: '0 18 * * *'
  workflow_dispatch:

jobs:
  build-mtf-vp:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Checkout Builder Repo
      uses: actions/checkout@v4

    - name: Check Upstream Hash
      id: check
      run: |
        LATEST_HASH=$(git -c credential.helper= ls-remote https://github.com/project-trans/MtF-wiki.git HEAD | awk '{print $1}')
        LOCAL_HASH=""; [ -f "profiles/mtf.last_hash" ] && LOCAL_HASH=$(cat profiles/mtf.last_hash)
        if [ "$LATEST_HASH" == "$LOCAL_HASH" ]; then
          echo "HAS_CHANGES=false" >> $GITHUB_OUTPUT
        else
          echo "HAS_CHANGES=true" >> $GITHUB_OUTPUT
          echo "LATEST_HASH=$LATEST_HASH" >> $GITHUB_ENV
        fi

    - name: Clone Upstream Wiki
      if: steps.check.outputs.HAS_CHANGES == 'true' || github.event_name == 'workflow_dispatch'
      run: |
        curl -sL https://github.com/project-trans/MtF-wiki/archive/HEAD.tar.gz -o upstream.tar.gz
        mkdir -p official-source && tar xzf upstream.tar.gz -C official-source --strip-components=1 && rm upstream.tar.gz

    - name: Setup Python + Node
      if: steps.check.outputs.HAS_CHANGES == 'true' || github.event_name == 'workflow_dispatch'
      uses: actions/setup-python@v5
      with: { python-version: '3.10' }
    - uses: pnpm/action-setup@v4
      if: steps.check.outputs.HAS_CHANGES == 'true' || github.event_name == 'workflow_dispatch'
      with: { version: 10 }
    - uses: actions/setup-node@v4
      if: steps.check.outputs.HAS_CHANGES == 'true' || github.event_name == 'workflow_dispatch'
      with: { node-version: 20, cache: 'pnpm', cache-dependency-path: 'New-Trans-Prism-Builder/work-mtf/package.json' }

    - name: Wash + Slim + Scaffold
      if: steps.check.outputs.HAS_CHANGES == 'true' || github.event_name == 'workflow_dispatch'
      run: |
        python -m pip install --upgrade pip Pillow pyyaml -q
        python tools/wash_hugo.py --profile profiles/mtf.yaml --src official-source --dest work-mtf-docs
        python tools/slim_images.py --docs work-mtf-docs
        python tools/slim_pdfs.py --docs work-mtf-docs --pdf-base https://mtf.wiki/static/documents/
        python tools/build_vp.py --profile profiles/mtf.yaml --docs work-mtf-docs --workdir work-mtf

    - name: Build VitePress
      if: steps.check.outputs.HAS_CHANGES == 'true' || github.event_name == 'workflow_dispatch'
      working-directory: ./work-mtf
      run: |
        pnpm install --no-frozen-lockfile
        pnpm build

    - name: Pack + Release
      if: steps.check.outputs.HAS_CHANGES == 'true' || github.event_name == 'workflow_dispatch'
      run: |
        RELEASE_DATE=$(date -d "+8 hours" +%Y-%m-%d)
        python tools/pack.py --profile profiles/mtf.yaml --workdir work-mtf --date $RELEASE_DATE
        python tools/audit_links.py work-mtf/docs/.vitepress/dist
        echo "TAG_NAME=mtf-$RELEASE_DATE" >> $GITHUB_ENV
        rm -rf official-source work-mtf-docs work-mtf
    - uses: softprops/action-gh-release@v2
      if: steps.check.outputs.HAS_CHANGES == 'true' || github.event_name == 'workflow_dispatch'
      with:
        files: mtf-wiki-site-*.zip
        tag_name: ${{ env.TAG_NAME }}
        name: "MtF VP 自动构建版 ${{ env.TAG_NAME }}"
        body: "🤖 上游同步 Hash: `${{ env.LATEST_HASH }}`"

    - name: Commit Sync Log
      if: steps.check.outputs.HAS_CHANGES == 'true'
      run: |
        echo ${{ env.LATEST_HASH }} > profiles/mtf.last_hash
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}
        git fetch origin ${{ github.ref_name }} && git reset --soft FETCH_HEAD
        git add profiles/mtf.last_hash
        git commit -m "📝 chore(mtf): 自动更新指纹日志" || echo "无新日志需要提交"
        git push origin HEAD:${{ github.ref_name }}
