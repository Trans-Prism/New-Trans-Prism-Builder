name: OTA Builder VP - Mio

# Mio 用自带主题：直通上游 docs/，仅改写 base:'./' + 剥 umami。
# 上游更新频率低，push 触发即可（由本仓手动 dispatch 或 cron兜底）。
on:
  schedule:
    - cron: '30 18 * * *'
  workflow_dispatch:

jobs:
  build-mio-vp:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Checkout Builder Repo
      uses: actions/checkout@v4

    - name: Check Upstream Hash
      id: check
      run: |
        LATEST_HASH=$(git -c credential.helper= ls-remote https://github.com/KitsuMio/MioMtFWiki.git HEAD | awk '{print $1}')
        LOCAL_HASH=""; [ -f "profiles/mio.last_hash" ] && LOCAL_HASH=$(cat profiles/mio.last_hash)
        if [ "$LATEST_HASH" == "$LOCAL_HASH" ]; then
          echo "HAS_CHANGES=false" >> $GITHUB_OUTPUT
        else
          echo "HAS_CHANGES=true" >> $GITHUB_OUTPUT
          echo "LATEST_HASH=$LATEST_HASH" >> $GITHUB_ENV
        fi

    - name: Clone Upstream Wiki
      if: steps.check.outputs.HAS_CHANGES == 'true' || github.event_name == 'workflow_dispatch'
      run: |
        git clone --depth 1 https://github.com/KitsuMio/MioMtFWiki.git official-source

    - name: Setup Python + Node
      if: steps.check.outputs.HAS_CHANGES == 'true' || github.event_name == 'workflow_dispatch'
      uses: actions/setup-python@v5
      with: { python-version: '3.10' }
    - uses: pnpm/action-setup@v4
      if: steps.check.outputs.HAS_CHANGES == 'true' || github.event_name == 'workflow_dispatch'
      with: { version: 10 }
    - uses: actions/setup-node@v4
      if: steps.check.outputs.HAS_CHANGES == 'true' || github.event_name == 'workflow_dispatch'
      with: { node-version: 20 }

    - name: Wash + Slim + Scaffold
      if: steps.check.outputs.HAS_CHANGES == 'true' || github.event_name == 'workflow_dispatch'
      run: |
        python -m pip install --upgrade pip Pillow pyyaml -q
        python tools/build_vp.py --profile profiles/mio.yaml --upstream official-source --workdir work-mio
        python tools/wash_vitepress.py --docs work-mio/docs
        python tools/slim_images.py --docs work-mio/docs
        # mio 无 pdf_base：slim_pdfs 会自动跳过

    - name: Build VitePress
      if: steps.check.outputs.HAS_CHANGES == 'true' || github.event_name == 'workflow_dispatch'
      working-directory: ./work-mio
      run: |
        npm install
        npm run docs:build

    - name: Pack + Release
      if: steps.check.outputs.HAS_CHANGES == 'true' || github.event_name == 'workflow_dispatch'
      run: |
        RELEASE_DATE=$(date -d "+8 hours" +%Y-%m-%d)
        python tools/pack.py --profile profiles/mio.yaml --workdir work-mio --date $RELEASE_DATE
        python tools/audit_links.py work-mio/docs/.vitepress/dist
        echo "TAG_NAME=miomtfwiki-$RELEASE_DATE" >> $GITHUB_ENV
        rm -rf official-source work-mio
    - uses: softprops/action-gh-release@v2
      if: steps.check.outputs.HAS_CHANGES == 'true' || github.event_name == 'workflow_dispatch'
      with:
        files: miomtfwiki-site-*.zip
        tag_name: ${{ env.TAG_NAME }}
        name: "Mio VP 自动构建版 ${{ env.TAG_NAME }}"
        body: "🤖 上游同步 Hash: `${{ env.LATEST_HASH }}`"

    - name: Commit Sync Log
      if: steps.check.outputs.HAS_CHANGES == 'true'
      run: |
        echo ${{ env.LATEST_HASH }} > profiles/mio.last_hash
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}
        git fetch origin ${{ github.ref_name }} && git reset --soft FETCH_HEAD
        git add profiles/mio.last_hash
        git commit -m "📝 chore(mio): 自动更新指纹日志" || echo "无新日志需要提交"
        git push origin HEAD:${{ github.ref_name }}
